apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx
  namespace: hanumanji
  labels:
    env: dev

spec:
  replicas: 3
  selector:
    app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
